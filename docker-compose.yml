services:
  postgres:
    build: ./docker/postgres
    image: wikimapia-postgres:16
    environment:
      POSTGRES_USER: wikimapia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wikimapia_local}
      POSTGRES_DB: wikimapia
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wikimapia -d wikimapia_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
